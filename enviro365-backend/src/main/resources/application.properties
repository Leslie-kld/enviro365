# Application
spring.application.name=enviro365-backend
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Return clean JSON error bodies instead of the Whitelabel error page
server.error.include-message=always
